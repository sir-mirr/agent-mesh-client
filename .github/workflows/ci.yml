name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # Re-runnable without a commit. A run failed on a transient GitHub download
  # error, and re-running it needed an endpoint that was itself returning 503 —
  # so the only way to ask "does it pass now" was to push something. A green
  # nobody can re-request is a green nobody can re-check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # The mutation set exists to make "this was mutation tested" re-runnable
      # instead of a sentence in a commit message. Nobody re-running it leaves
      # it exactly as stale as the sentence it replaced.
      #
      # `--fast` because the rest stand up a real hub through the platform
      # harness, which is not checked out here; the run says how many it
      # skipped rather than reporting a partial pass as a whole one.
      - run: bun run mutation-check -- --fast
      # And the inversion, which is what says the reporting branch still works.
      # A set where everything is caught never executes the code that says
      # something was not.
      - run: bun run mutation-check -- --self-check
      - run: bun run build
      # The artifact users install, actually run. `bun test` and the scenario
      # runner exercise `src/` -- the standalone binary is a different build,
      # and until this step it was executed by nothing: CI never compiled it,
      # and the live-acceptance script imports the source rather than running
      # it. A green run said nothing about the thing on the releases page.
      #
      # A short runtime directory on purpose: a unix socket path has about a
      # hundred characters to work with, and the default runner temp path is
      # long enough to spend them.
      - run: bun run compile
      - run: |
          mkdir -p /tmp/amci
          test "$(./dist/agent-mesh --version)" = "$(bun --eval 'console.log((await Bun.file("package.json").json()).version)')"
          ./dist/agent-mesh doctor --config /tmp/amci/c.yaml --state-dir /tmp/amci/s --runtime-dir /tmp/amci
          test "$(./dist/agent-mesh lane list --config /tmp/amci/c.yaml --state-dir /tmp/amci/s --runtime-dir /tmp/amci)" = "[]"
