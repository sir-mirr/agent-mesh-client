name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            asset: darwin-arm64
          # Cross-compiled from Apple Silicon rather than built on an Intel
          # runner. `macos-13` never started: v0.1.0 held it queued for 53
          # minutes while the other three targets finished in 15-19 seconds,
          # so the runner is not available to this project at all.
          #
          # `bun build --compile --target=` handles the cross-compile — checked
          # locally before this was written, producing a 66 MB
          # `Mach-O 64-bit executable x86_64`.
          #
          # **Not verified on Intel hardware.** It was executed here only
          # through Rosetta, which proves the artifact is well-formed and the
          # bundle intact, and proves nothing about a real Intel Mac. Rosetta
          # also does not expose AVX, so the binary warns about it there; that
          # warning is about this host, not about the machines this asset is
          # for.
          - runner: macos-14
            target: bun-darwin-x64
            asset: darwin-x64
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      # test/lane-session-release.test.ts drives a real tmux session, because
      # what it checks is that removing an agent closes one. The runners do not
      # ship tmux, and that test fails rather than skipping when it is missing --
      # so the dependency gets installed rather than worked around. This
      # repository needs tmux to attach to an agent at all.
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew list tmux >/dev/null 2>&1 || brew install tmux;
          else sudo apt-get update -qq && sudo apt-get install -y -qq tmux; fi
      - run: bun test
      # The same guards CI runs. A release built behind weaker verification than
      # an ordinary push is the one build where that matters most.
      - run: bun run mutation-check -- --fast
      - run: bun run mutation-check -- --self-check
      # The tag is the authority for a released artifact. Without this the
      # binary reports whatever the manifest happened to say -- v0.1.1 shipped
      # one answering `0.1.0-dev.0`, a version matching no tag anyone could
      # have installed.
      #
      # The logic is in `scripts/set-version.ts` rather than inline here, so
      # `bun test` executes it on every push. Inline, the only way to run it was
      # to cut a tag: the fix for v0.1.1 sat written and asserted and unexecuted,
      # and the next tag would have been its first run.
      - run: bun run scripts/set-version.ts
      - run: bun build --compile --target=${{ matrix.target }} ./src/cli.ts --outfile=agent-mesh
      # What the artifact answers, checked on the artifact rather than assumed
      # from the input. Only where the runner can execute what it just built.
      - if: runner.os == 'Linux' || matrix.target == 'bun-darwin-arm64'
        run: test "$(./agent-mesh --version)" = "${GITHUB_REF_NAME#v}"
      - run: tar -czf agent-mesh-${{ matrix.asset }}.tar.gz agent-mesh
      # Pinned at v4 deliberately. It targets Node 20, which the runners now
      # force onto Node 24 with a deprecation warning, so this needs bumping —
      # but v4 -> v7 crosses three majors, `download-artifact` is at v8, and
      # the `merge-multiple` the publish job depends on may not have survived
      # them. Neither manifest could be read at the time of writing.
      #
      # Not bumped blind: this is the one path a release goes through, it was
      # verified end to end for v0.1.1, and the only way to test a change here
      # is to cut another tag. Bump it, read both manifests, and cut a patch
      # release whose only content is that change.
      - uses: actions/upload-artifact@v4
        with:
          name: agent-mesh-${{ matrix.asset }}
          path: agent-mesh-${{ matrix.asset }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Next to the assets, not only in the workflow that built them. A
          # reader of this file is a maintainer; a reader of the release page
          # is the person about to run the binary, and the limitation is theirs
          # to know.
          body: |
            Standalone binaries. No Bun, Node or npm needed to run them.

            Verify against `SHA256SUMS`, or use the installer:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/sir-mirr/agent-mesh-client/main/install.sh | sh
            ```

            **`darwin-x64` is cross-compiled on Apple Silicon and has not been
            verified on a real Intel Mac.** The other three targets are built
            on their own architecture. If it fails for you, that is the first
            measurement anyone has of it — please report what you see.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # What the release page actually serves, downloaded and executed.
  #
  # Every check above runs inside the job that produced the binary, on the file
  # it just built. That is not the same object a user gets: it still has to be
  # tarred, uploaded, merged across four jobs, and attached to a release. v0.1.1
  # was green through all of it and shipped a binary answering `0.1.0-dev.0`.
  #
  # So this pulls the published asset back down and asks it. A workflow that is
  # green while the artifact is wrong is the failure this release exists to fix,
  # and it cannot be caught by anything that never downloads.
  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-14
            asset: darwin-arm64
          # `darwin-x64` is absent on purpose. It is cross-compiled and this
          # project has no Intel runner -- `macos-13` never started, holding
          # v0.1.0 queued for 53 minutes. Running it here through Rosetta would
          # produce a green about this host, not about the machines that asset
          # is for. Three of four assets are executed after publishing; the
          # fourth is not, and the release notes say so.
    runs-on: ${{ matrix.runner }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "agent-mesh-$ASSET.tar.gz" --pattern 'SHA256SUMS' --dir published
          cd published
          # The installer verifies against this file, so a wrong sum ships a
          # download nobody can install rather than one that misreports itself.
          # macOS has shasum, Linux has sha256sum; neither runner has both.
          if command -v sha256sum >/dev/null 2>&1; then
            grep "agent-mesh-$ASSET.tar.gz" SHA256SUMS | sha256sum -c -
          else
            grep "agent-mesh-$ASSET.tar.gz" SHA256SUMS | shasum -a 256 -c -
          fi
          tar -xzf "agent-mesh-$ASSET.tar.gz"
          got="$(./agent-mesh --version)"
          want="${GITHUB_REF_NAME#v}"
          echo "published $ASSET --version = $got   tag = $GITHUB_REF_NAME"
          test "$got" = "$want"
      # And the path a user actually takes to this release, taken. The job
      # above proves the asset is right; this proves the thing that fetches it
      # works against this tag.
      - env:
          AGENT_MESH_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          AGENT_MESH_INSTALL_DIR="$dir" AGENT_MESH_INSTALL_SERVICE=0 \
            sh <(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh")
          got="$("$dir/agent-mesh" --version)"
          echo "installer delivered $got for $AGENT_MESH_VERSION"
          test "$got" = "${AGENT_MESH_VERSION#v}"
